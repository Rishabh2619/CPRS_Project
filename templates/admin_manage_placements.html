{% extends "base.html" %}

{% block title %}Post New Job - Placement Portal{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 700px;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Post New Job Opportunity</h2>
    
    <form action="{{ url_for('admin_create_placement') }}" method="POST">
        <div class="grid grid-2">
            <div class="form-group">
                <label for="title">Job Title</label>
                <input type="text" id="title" name="title" required placeholder="Software Engineer">
            </div>
            <div class="form-group">
                <label for="company">Company Name</label>
                <input type="text" id="company" name="company" required placeholder="Tech Corp">
            </div>
        </div>

        <div class="grid grid-2">
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="Remote / New York / Delhi">
            </div>
            <div class="form-group">
                <label for="salary">Salary / CTC Package</label>
                <input type="text" id="salary" name="salary" placeholder="$80,000 / 8 LPA">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Job Description</label>
            <textarea id="description" name="description" rows="4" required placeholder="Overview of the role and responsibilities..."></textarea>
        </div>

        <div class="form-group">
            <label for="requirements">Requirements & Eligibility</label>
            <textarea id="requirements" name="requirements" rows="3" placeholder="CGPA > 7.0, Proficient in Python, JS..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Publish Job Drive</button>
    </form>
</div>
{% endblock %}
