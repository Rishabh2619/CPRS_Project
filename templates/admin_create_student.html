{% extends "base.html" %}

{% block title %}Create Student Account - Placement Portal{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Student Account</h2>
    
    <form action="{{ url_for('admin_create_student') }}" method="POST">
        <div class="form-group">
            <label for="name">Student Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Jane Doe">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="jane@coer.ac.in">
        </div>

        <div class="form-group">
            <label for="password">Initial Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>
</div>
{% endblock %}
